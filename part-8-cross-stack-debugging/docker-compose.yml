name: part8-cross-stack-debugging

services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6308:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: auction
      RABBITMQ_DEFAULT_PASS: auction
    ports:
      - "127.0.0.1:5608:5672"
      - "127.0.0.1:15608:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_ORIGINS: "http://localhost:5108,http://127.0.0.1:5108"
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_HEADERS: "Content-Type"
    command:
      - "--collector.otlp.enabled=true"
    ports:
      - "127.0.0.1:16608:16686"
      - "127.0.0.1:4308:4318"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269/"]
      interval: 2s
      timeout: 5s
      retries: 20
